model:
  backbone_name: "Qwen/Qwen3-Embedding-0.6B"
  hidden_size: 1024
  num_summary_tokens: 32
  query_max_len: 32
  n_query_adapter_layers: 2
  n_query_adapter_heads: 8
  n_cross_attn_layers: 1
  n_cross_attn_heads: 8
  doc_chunk_size: 1024
  mask_token: "<|vision_pad|>"

teacher:
  teacher_name: "Qwen/Qwen3-Reranker-8B"
  instruction: "Given a web search query, retrieve relevant passages that answer the query"
  max_length: 32768
  torch_dtype: "bfloat16"
  batch_size: 16

data:
  keypoints_dir: "../data/msmarco-document/full_run"
  negative_dir: "../data/msmarco-document/negative_query"
  unified_path: "data/unified_examples.jsonl"
  idf_path: "data/idf_table.pt"
  scored_path: "data/unified_examples.scored.jsonl"
  # Optional JSON/JSONL mapping doc_id to one main keypoint.
  # Alternatively, supply main_keypoint on every scored row.
  main_keypoints_path: null
  neg_per_keypoint: 2
  hardneg_per_keypoint: 2

loss:
  lambda_coverage: 1.0
  lambda_keypoint: 1.0
  lambda_sparsity: 0.01

train:
  output_dir: "runs/default"
  lr: 2.0e-5
  weight_decay: 0.01
  batch_size: 8
  grad_accum_steps: 4
  epochs: 5
  warmup_ratio: 0.05
  bf16: true
  log_every: 20
  save_every: 1000
  seed: 42
  num_workers: 2
  max_grad_norm: 1.0
